name: halen
description: "Halen: Quit Smoking Tracker — Reduce at your pace. Quit for good."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # State management
  flutter_riverpod: ^3.0.0

  # Local encrypted database (drift + SQLCipher)
  drift: ^2.34.0
  sqlcipher_flutter_libs: ^0.6.6
  sqlite3: ^3.5.2

  # Secure key storage (Android Keystore / iOS Keychain)
  flutter_secure_storage: ^10.0.0

  # Platform integrations
  in_app_purchase: ^3.2.0
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  home_widget: ^0.7.0
  shared_preferences: ^2.5.0
  path_provider: ^2.1.0

  cupertino_icons: ^1.0.8
  in_app_purchase_android: ^0.5.3
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.4.15
  riverpod: ^3.4.3

flutter:
  uses-material-design: true
  generate: true
