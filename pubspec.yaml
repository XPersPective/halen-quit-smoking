name: halen
description: "Halen: Quit Smoking Tracker — Reduce at your pace. Quit for good."
publish_to: "none"
version: 1.2.1+2

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # State management
  flutter_riverpod: ^3.0.0

  # Local encrypted database (drift + SQLCipher)
  drift: ^2.34.0
  sqlite3: ^3.5.2

  # Secure key storage (Android Keystore / iOS Keychain)
  flutter_secure_storage: ^10.0.0

  # Platform integrations
  in_app_purchase: ^3.2.0
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  home_widget: ^0.7.0
  shared_preferences: ^2.5.0
  path_provider: ^2.1.0

  cupertino_icons: ^1.0.8
  in_app_purchase_android: ^0.5.3
  file_selector: ^1.1.0
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.4.15
  riverpod: ^3.4.3

# Which SQLite the build hook bundles. Without this the default is plain
# SQLite, which has never heard of `PRAGMA key` — and SQLite silently ignores
# pragmas it does not know, so the database would be written in PLAINTEXT
# while the app promised encryption. connection.dart asserts cipher_version
# at open time so that can never happen quietly again.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

flutter:
  uses-material-design: true
  generate: true
  fonts:
    # Inter, the variable original. Declaring the one file under four weights
    # instances the wght axis instead of letting the engine synthesise a fake
    # bold, which is what makes hand-rolled font setups look smeared.
    # SIL Open Font License 1.1 — assets/fonts/OFL.txt.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
          weight: 400
        - asset: assets/fonts/Inter.ttf
          weight: 500
        - asset: assets/fonts/Inter.ttf
          weight: 600
        - asset: assets/fonts/Inter.ttf
          weight: 700
