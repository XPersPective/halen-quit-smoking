name: Halen Android release

on:
  workflow_dispatch:
    inputs:
      track:
        description: Google Play track
        type: choice
        options:
          - internal
          - production
        default: internal
        required: true

permissions:
  contents: read

jobs:
  build-and-submit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_UPLOAD_KEY_BASE64: ${{ secrets.HALEN_ANDROID_UPLOAD_KEY_BASE64 }}
      ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.HALEN_ANDROID_UPLOAD_STORE_PASSWORD }}
      ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.HALEN_ANDROID_UPLOAD_KEY_PASSWORD }}
      ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.HALEN_ANDROID_UPLOAD_KEY_ALIAS }}
      ADMOB_APP_ID_ANDROID: ${{ vars.HALEN_ADMOB_APP_ID_ANDROID }}
      ADMOB_BANNER_ANDROID: ${{ vars.HALEN_ADMOB_BANNER_ANDROID }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.HALEN_GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.2"
          cache: true

      - name: Validate release configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_UPLOAD_KEY_BASE64 ANDROID_UPLOAD_STORE_PASSWORD \
            ANDROID_UPLOAD_KEY_PASSWORD ANDROID_UPLOAD_KEY_ALIAS \
            ADMOB_APP_ID_ANDROID ADMOB_BANNER_ANDROID \
            GOOGLE_PLAY_SERVICE_ACCOUNT_JSON; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required GitHub secret or variable: $name"
              exit 1
            fi
          done
          [[ "$ADMOB_APP_ID_ANDROID" =~ ^ca-app-pub-[0-9]+~[0-9]+$ ]]
          [[ "$ADMOB_BANNER_ANDROID" =~ ^ca-app-pub-[0-9]+/[0-9]+$ ]]
          mkdir -p android/app
          printf '%s' "$ANDROID_UPLOAD_KEY_BASE64" | base64 --decode > android/app/upload.jks
          cat > android/app/key.properties <<EOF
          storeFile=upload.jks
          storePassword=$ANDROID_UPLOAD_STORE_PASSWORD
          keyPassword=$ANDROID_UPLOAD_KEY_PASSWORD
          keyAlias=$ANDROID_UPLOAD_KEY_ALIAS
          EOF

      - name: Require verified Data safety declaration for production
        if: ${{ inputs.track == 'production' }}
        env:
          DATA_SAFETY_VERIFIED: ${{ vars.HALEN_PLAY_DATA_SAFETY_VERIFIED }}
        run: |
          if [[ "$DATA_SAFETY_VERIFIED" != "true" ]]; then
            echo 'Production upload is blocked until the Play Data safety declaration is verified.'
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Verify generated code
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n
          git diff --exit-code

      - name: Analyze and test
        run: |
          flutter analyze --fatal-infos
          flutter test --reporter compact

      - name: Build signed Android App Bundle
        env:
          HALEN_SIGNING: ${{ github.workspace }}/android/app/key.properties
        run: >-
          flutter build appbundle --release
          --dart-define=ADMOB_BANNER_ANDROID=${{ vars.HALEN_ADMOB_BANNER_ANDROID }}

      - name: Verify bundle identity and signature
        shell: bash
        run: |
          set -euo pipefail
          bundle=build/app/outputs/bundle/release/app-release.aab
          test -s "$bundle"
          # Android upload keys are intentionally self-signed. Verify the
          # bundle signature cryptographically without requiring a public CA.
          jarsigner -verify "$bundle"

      - name: Keep signed bundle as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: halen-android-1.4.2-build-8
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Submit to Google Play
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.HALEN_GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.crazypenguin.halenquitsmoking
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          status: completed
          releaseName: Halen 1.4.2 (8)
          inAppUpdatePriority: 1
